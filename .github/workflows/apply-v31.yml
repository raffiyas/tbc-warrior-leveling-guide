name: Apply V3.1 Companion Migration

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-v31.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply migration
        run: python scripts/apply_v31.py
      - name: Commit V3.1
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "feat: integrate My Warrior and item comparator v3.1"
          git push
