name: Fix Comparator Type Labels
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-compare-labels.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python scripts/fix_compare_type_labels.py
      - run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add compare.html
          git commit -m "fix: use neutral weapon family labels"
          git push
